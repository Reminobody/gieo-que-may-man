<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tân Xuân Ươm Mầm</title>
    
    <!-- 
    ╔════════════════════════════════════════════════════════════════╗
    ║          HƯỚNG DẪN THAY ĐỔI ICON VÀ TRANG TRÍ                ║
    ╠════════════════════════════════════════════════════════════════╣
    ║                                                                ║
    ║  1. TRANG TRÍ NỀN (dòng ~200):                                ║
    ║     - Đèn lồng 2 bên: 🏮                                       ║
    ║     - Mây bay: ☁️                                             ║
    ║     - Texture nền: Pattern kim cương + chấm tròn              ║
    ║                                                                ║
    ║  2. NÚT TƯỚI NƯỚC (dòng ~240):                                ║
    ║     - Icon giọt nước: 💧                                       ║
    ║     - Text: "Tưới Nước!"                                       ║
    ║                                                                ║
    ║  3. PROGRESS BAR (dòng ~130):                                 ║
    ║     - Màu sắc gradient của thanh tiến trình                   ║
    ║     - Màu viền và background                                  ║
    ║                                                                ║
    ║  4. CÁC GIAI ĐOẠN CÂY (dòng ~290 - JavaScript):               ║
    ║     - 3 loại cây: mai, dao, quat                              ║
    ║     - Mỗi loại có 7 giai đoạn (stages array)                  ║
    ║     - Thay đổi emoji trong mảng stages[]                       ║
    ║                                                                ║
    ║  5. CÂU ĐỘNG VIÊN (dòng ~330):                                ║
    ║     - 7 câu tương ứng 7 giai đoạn                             ║
    ║     - Thay text hoặc thêm emoji                               ║
    ║                                                                ║
    ║  6. PHÁO HOA (dòng ~400):                                     ║
    ║     - Số lượng pháo hoa, particles                            ║
    ║     - Màu sắc và tốc độ                                       ║
    ║                                                                ║
    ║  💡 TÌM EMOJI: https://emojipedia.org                         ║
    ║  💡 Copy emoji và paste vào vị trí muốn thay đổi             ║
    ║                                                                ║
    ╚════════════════════════════════════════════════════════════════╝
    -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #FFF8E7;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255, 215, 0, 0.05) 35px, rgba(255, 215, 0, 0.05) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255, 100, 100, 0.05) 35px, rgba(255, 100, 100, 0.05) 70px),
                radial-gradient(circle at 20% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 100, 100, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle, rgba(255, 215, 0, 0.15) 1px, transparent 1px),
                radial-gradient(circle, rgba(255, 100, 100, 0.15) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 25px 25px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .lantern {
            position: fixed;
            font-size: 3rem;
            animation: swingLantern 3s ease-in-out infinite;
            z-index: 0;
            opacity: 0.8;
        }

        @keyframes swingLantern {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        .lantern-left {
            top: 50px;
            left: 5%;
        }

        .lantern-right {
            top: 50px;
            right: 5%;
        }

        .clouds {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            z-index: 0;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            bottom: 0;
            font-size: 4rem;
            opacity: 0.3;
            animation: floatCloud 20s linear infinite;
        }

        @keyframes floatCloud {
            from { transform: translateX(-100px); }
            to { transform: translateX(calc(100vw + 100px)); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .title {
            color: #d32f2f;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1); }
            to { text-shadow: 2px 2px 8px rgba(255, 215, 0, 0.6); }
        }

        .tree-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 6px solid #d32f2f;
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tree-display {
            width: 100%;
            height: 350px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }

        .tree {
            font-size: 12rem;
            transition: all 0.3s ease;
            transform-origin: bottom center;
        }

        .tree.growing {
            animation: grow 0.5s ease;
        }

        @keyframes grow {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .encouragement {
            min-height: 40px;
            font-size: 1.3rem;
            color: #ff6b6b;
            font-weight: 600;
            margin: 15px 0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .water-button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
        }

        .water-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(79, 172, 254, 0.6);
        }

        .water-button:active {
            transform: translateY(0);
        }

        .water-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .completion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .completion-overlay.show {
            display: flex;
        }

        .completion-message {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: scale(0.8) translateY(-50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .completion-message h2 {
            color: #ff6b6b;
            font-size: 2rem;
            margin: 10px 0 20px 0;
        }

        .completion-message .poem {
            color: #333;
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 20px 0;
            font-style: italic;
        }

        .completion-message .signature {
            color: #666;
            font-size: 1rem;
            margin-top: 20px;
            font-weight: 600;
        }

        .plant-info {
            font-size: 1.2rem;
            color: #333;
            margin: 15px 0 20px 0;
            font-weight: 600;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-replay {
            background: #FFD700;
            color: #333;
        }

        .btn-replay:hover {
            background: #FFC700;
            transform: translateY(-2px);
        }

        .btn-share {
            background: #ff6b6b;
            color: white;
        }

        .btn-share:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #FFD700;
            position: absolute;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes fireworkExplosion {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }

        .firework-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: fireworkExplosion 1.5s ease-out forwards;
            z-index: 10000;
        }

        .decorations {
            position: absolute;
            font-size: 2rem;
            animation: swing 2s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .stage-indicator {
            display: none;
        }

        .progress-container {
            width: 100%;
            max-width: 400px;
            margin: 20px 0 25px 0;
        }

        .progress-label {
            display: none;
        }

        .progress-bar-wrapper {
            width: 100%;
            height: 25px;
            background: #f0f0f0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 2px solid #d32f2f;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            /* === THAY ĐỔI MÀU PROGRESS BAR ===
               Gradient hiện tại: đỏ → vàng → vàng đậm
               Thay đổi các mã màu bên dưới:
            */
            background: linear-gradient(90deg, #ff6b6b 0%, #ffd93d 50%, #FFD700 100%);
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.3) 50%, 
                transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            position: relative;
            z-index: 1;
            font-size: 0.8rem;
            color: #fff;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 1.3rem;
            }

            .tree {
                font-size: 8rem;
            }

            .tree-display {
                height: 280px;
            }

            .water-button {
                padding: 15px 35px;
                font-size: 1.2rem;
            }

            .completion-message {
                padding: 30px 20px;
            }

            .completion-message h2 {
                font-size: 1.5rem;
            }

            .completion-message .poem {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 
    ===== HƯỚNG DẪN THAY ĐỔI ICON TRANG TRÍ =====
    Bạn có thể thay đổi bất kỳ emoji/icon nào dưới đây theo ý muốn:
    
    🏮 Đèn lồng - Có thể đổi thành: 🎐 🎊 🎋 🧧 🪔
    ☁️ Mây - Có thể đổi thành: 🦋 🐦 🕊️
    
    Chỉ cần tìm emoji/icon trong code và thay thế!
    ============================================
    -->
    
    <!-- Đèn lồng 2 bên (thay đổi emoji ở đây) -->
    <div class="lantern lantern-left">🏮</div>
    <div class="lantern lantern-right">🏮</div>
    
    <!-- Mây bay (thay đổi emoji ở đây) -->
    <div class="clouds">
        <div class="cloud" style="animation-delay: 0s;">☁️</div>
        <div class="cloud" style="animation-delay: 8s;">☁️</div>
        <div class="cloud" style="animation-delay: 16s;">☁️</div>
    </div>

    <div class="container">
        <h1 class="title">🎊 Tân Xuân Ươm Mầm 🎊</h1>
        
        <div class="tree-container">
            <div class="tree-display">
                <div id="tree" class="tree">🪴</div>
            </div>
            
            <div id="encouragement" class="encouragement"></div>
            
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-label">Tiến trình: <span id="progressLabel">1/7</span></div>
                <div class="progress-bar-wrapper">
                    <div id="progressBar" class="progress-bar" style="width: 14.28%;">
                        <span class="progress-text">14%</span>
                    </div>
                </div>
            </div>
            
            <!-- Kept for backward compatibility but hidden -->
            <div id="stageIndicator" class="stage-indicator">Giai đoạn: 1/7</div>
            
            <!-- 
            NÚT TƯỚI NƯỚC - Thay đổi icon và text ở đây
            Emoji có thể dùng: 💧 💦 🚿 🫗 ☔ 🌊
            -->
            <button id="waterButton" class="water-button">
                💧 Tưới Nước!
            </button>
        </div>
    </div>

    <div id="completionOverlay" class="completion-overlay">
        <div class="completion-message">
            <div id="plantInfo" class="plant-info"></div>
            
            <h2 style="color: #ff6b6b; font-size: 2rem; margin: 10px 0 20px 0;">Chúc Bạn Năm Mới!</h2>
            
            <div class="poem">
                Thân tâm an lạc tựa tùng hạc,<br>
                vận may rạng rỡ tựa thái dương.<br>
                Vạn dặm hành trình đều gặp quý nhân,<br>
                mọi lối rẽ đều hướng về hạnh phúc.
            </div>
            
            <div class="signature">From: Reminobody</div>
            
            <div class="action-buttons">
                <button id="replayButton" class="btn btn-replay">🔄 Chơi Lại</button>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let currentStage = 1;
        let plantType = '';
        
        /* 
        ===== HƯỚNG DẪN THAY ĐỔI ICON CÂY =====
        
        Mỗi loại cây có 7 giai đoạn (stages array).
        Bạn có thể thay đổi bất kỳ emoji nào trong các giai đoạn:
        
        Giai đoạn 1: Chậu trống (hiện tại: 🌱)
        Giai đoạn 2: Mầm nhỏ (hiện tại: 🌿)
        Giai đoạn 3-5: Cây lớn dần
        Giai đoạn 6-7: Cây nở hoa/quả
        
        VÍ DỤ EMOJI CÓ THỂ DÙNG:
        - Chậu: 🌱
        - Mầm: 🌿
        - Lá: 🍀
        - Hoa: 🌸  🌺 🏵️
        - Quả: 🍊 🍋 🍎 🍑 🍒 🍓
        
        Chỉ cần sửa trong mảng 'stages' của từng loại cây!
        
        === THÊM LOẠI CÂY MỚI ===
        Copy đoạn code sau và thêm vào sau cây 'quat':
        
        ,
        tencay: {
            name: 'Tên Cây Của Bạn',
            emoji: '🌺',
            meaning: 'Ý nghĩa',
            color: '#FF1493',
            stages: ['🏺', '🌱', '🌿', '🌿🌿', '🌿🌿🌿', '🌺🌿🌺', '🌺🌺🌺']
        }
        
        =========================================
        */
        
        // Plant types configuration
        const plants = {
            mai: {
                name: 'Hoa Mai',
                emoji: '🌼',
                meaning: 'Thịnh vượng',
                color: '#FFD700',
                stages: ['🌱', '🌿', '🍀', '🌼', '🌼🌿', '🌼🌿🌼', '🌼🌼🌼']
            },
            dao: {
                name: 'Hoa Đào',
                emoji: '🌸',
                meaning: 'Khởi đầu mới',
                color: '#FFB6C1',
                stages: ['🌱', '🌿', '🍀', '🌼', '🌸🌿', '🌸🌿🌸', '🌸🌸🌸']
            },
            quat: {
                name: 'Cây Quất',
                emoji: '🍊',
                meaning: 'Sung túc',
                color: '#FFA500',
                stages: ['🌱', '🌿', '🍀', '🌼', '🌿🍊', '🌿🍊🍊', '🍊🍊🍊']
            }
        };

        /* 
        ===== THAY ĐỔI CÂU ĐỘNG VIÊN =====
        Bạn có thể thay đổi text hoặc thêm emoji cho từng giai đoạn
        ======================================
        */
        
        // Encouragement messages
        const messages = {
            1: '',
            2: '🌱 Nảy mầm',
            3: '🌿 Cây đang lớn lên',
            4: '✨ Sắp nở hoa đẹp lắm',
            5: '🌟 Cây đang phát triển tốt',
            6: '🎉 May mắn đang đến',
            7: '🎊 Thành công'
        };

        // DOM elements
        const treeElement = document.getElementById('tree');
        const encouragementElement = document.getElementById('encouragement');
        const stageIndicatorElement = document.getElementById('stageIndicator');
        const progressBar = document.getElementById('progressBar');
        const progressLabel = document.getElementById('progressLabel');
        const waterButton = document.getElementById('waterButton');
        const completionOverlay = document.getElementById('completionOverlay');
        const plantInfo = document.getElementById('plantInfo');
        const replayButton = document.getElementById('replayButton');
        const shareButton = document.getElementById('shareButton');

        // Initialize game
        function initGame() {
            // Randomly select plant type
            const plantKeys = Object.keys(plants);
            plantType = plantKeys[Math.floor(Math.random() * plantKeys.length)];
            
            currentStage = 1;
            updateDisplay();
            completionOverlay.classList.remove('show');
            waterButton.disabled = false;
        }

        // Update display
        function updateDisplay() {
            const plant = plants[plantType];
            treeElement.textContent = plant.stages[currentStage - 1];
            encouragementElement.textContent = messages[currentStage] || '';
            
            // Update progress bar
            const progressPercentage = (currentStage / 7) * 100;
            progressBar.style.width = progressPercentage + '%';
            progressLabel.textContent = `${currentStage}/7`;
            progressBar.querySelector('.progress-text').textContent = Math.round(progressPercentage) + '%';
            
            // Legacy stage indicator (hidden)
            stageIndicatorElement.textContent = `Giai đoạn: ${currentStage}/7`;
            
            // Add growing animation
            treeElement.classList.remove('growing');
            setTimeout(() => {
                treeElement.classList.add('growing');
            }, 10);
        }

        // Water plant function
        function waterPlant() {
            if (currentStage < 7) {
                currentStage++;
                updateDisplay();
                
                if (currentStage === 7) {
                    setTimeout(() => {
                        completeTree();
                    }, 500);
                }
            }
        }

        // Complete tree
        function completeTree() {
            waterButton.disabled = true;
            
            // Create initial fireworks effect
            createFireworks();
            
            // Create confetti
            setTimeout(() => {
                createConfetti();
            }, 500);
            
            // Show completion message with more fireworks
            setTimeout(() => {
                const plant = plants[plantType];
                plantInfo.innerHTML = `Bạn đã trồng được <strong>${plant.name}</strong>! ${plant.emoji}<br><span style="color: ${plant.color};">(${plant.meaning})</span>`;
                completionOverlay.classList.add('show');
                
                // Create another round of fireworks when popup appears
                setTimeout(() => {
                    createFireworks();
                }, 200);
            }, 1000);
        }

        // Create fireworks effect
        function createFireworks() {
            const plant = plants[plantType];
            
            /* 
            === THAY ĐỔI PHÁO HOA ===
            - Số lượng pháo hoa: thay đổi số 12 trong vòng lặp đầu tiên
            - Số particles mỗi pháo: thay đổi số 40 trong vòng lặp thứ hai
            - Tốc độ nổ: thay đổi burst * 300 (milliseconds)
            - Màu sắc: thêm/bớt mã màu trong mảng colors
            */
            const colors = {
                mai: ['#FFD700', '#FFA500', '#FFED00', '#FF8C00'],
                dao: ['#FFB6C1', '#FFC0CB', '#FF69B4', '#FF1493'],
                quat: ['#FFA500', '#FF8C00', '#32CD32', '#FFD700']
            };
            
            const plantColors = colors[plantType];
            
            // Create multiple firework bursts (thay đổi số 12 để có nhiều/ít pháo hơn)
            for (let burst = 0; burst < 12; burst++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * (window.innerHeight * 0.6) + 50;
                    
                    // Create particles for this burst (40 particles mỗi pháo)
                    for (let i = 0; i < 40; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework-particle';
                        
                        const angle = (Math.PI * 2 * i) / 40;
                        const velocity = 80 + Math.random() * 120;
                        const tx = Math.cos(angle) * velocity;
                        const ty = Math.sin(angle) * velocity;
                        
                        particle.style.left = x + 'px';
                        particle.style.top = y + 'px';
                        particle.style.background = plantColors[Math.floor(Math.random() * plantColors.length)];
                        particle.style.setProperty('--x', tx + 'px');
                        particle.style.setProperty('--y', ty + 'px');
                        particle.style.boxShadow = `0 0 15px ${plantColors[Math.floor(Math.random() * plantColors.length)]}`;
                        
                        document.body.appendChild(particle);
                        
                        setTimeout(() => {
                            particle.remove();
                        }, 1500);
                    }
                }, burst * 300);
            }
        }

        // Create confetti effect
        function createConfetti() {
            const plant = plants[plantType];
            
            /* 
            === THAY ĐỔI MÀU CONFETTI ===
            Mỗi loại cây có bộ màu riêng cho hiệu ứng confetti
            Thay đổi màu hex code bên dưới
            */
            const colors = {
                mai: ['#FFD700', '#FFA500', '#FFED00'],      // Vàng
                dao: ['#FFB6C1', '#FFC0CB', '#FF69B4'],      // Hồng
                quat: ['#FFA500', '#FF8C00', '#32CD32']      // Cam-xanh
            };
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[plantType][Math.floor(Math.random() * colors[plantType].length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 4000);
                }, i * 50);
            }
        }

        // Reset game
        function resetGame() {
            initGame();
        }

        // Share function
        function shareGame() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'Tân Xuân Ươm Mầm - Bính Ngọ 2026',
                    text: 'Chúc bạn năm mới vạn sự như ý! Hãy trồng cây may mắn của bạn!',
                    url: url
                }).catch(() => {
                    copyToClipboard(url);
                });
            } else {
                copyToClipboard(url);
            }
        }

        // Copy to clipboard
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            alert('Đã sao chép link! 🎊');
        }

        // Event listeners
        waterButton.addEventListener('click', waterPlant);
        replayButton.addEventListener('click', resetGame);
        shareButton.addEventListener('click', shareGame);

        // Initialize on load
        initGame();
    </script>
</body>
</html>
